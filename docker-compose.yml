services:
  redis:
    image: redis:7-alpine
    container_name: skillbridge-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - skillbridge-network
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./src/backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - skillbridge-network

  frontend:
    build:
      context: ./src/skillbridge-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
        - VITE_SOCKET_URL=/
    container_name: skillbridge-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - skillbridge-network

volumes:
  redis-data:

networks:
  skillbridge-network:
    driver: bridge
